<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPI → Yelp URL Builder (Resilient+Retry)</title>
  <style>
    :root {
      --bg: #0b1020; --card: #11162a; --muted: #8891a7; --text: #eef2ff;
      --accent: #6ee7b7; --danger: #fb7185; --border: #1f2742; --focus: #93c5fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; background: var(--bg);
      color: var(--text); font-family: Inter, system-ui, sans-serif; line-height: 1.45;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .card {
      background: rgba(17, 22, 42, 0.92); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    textarea, select, input {
      width: 100%; color: var(--text); background: #0c1224; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; outline: none; margin-bottom: 10px;
    }
    textarea { min-height: 120px; font-family: monospace; }
    .btn {
      border: 1px solid var(--border); background: #1b2a4b;
      color: var(--text); padding: 10px 14px; border-radius: 10px;
      cursor: pointer; font-weight: 600;
    }
    .btn.primary { background: #1e40af; border-color: #2b4ea5; }
    .btn.xs { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
    .status { margin-top: 10px; font-size: .9rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; background: #0c1224; border-radius: 12px; overflow: hidden; }
    th { background: #0f1730; color: #c7d2fe; text-align: left; padding: 12px; font-size: .9rem; }
    td { padding: 10px 12px; border-bottom: 1px solid #111936; font-size: .92rem; vertical-align: middle; }
    .error-text { color: var(--danger); font-size: 0.9rem; }
    .muted { color: var(--muted); }
    .mono { font-family: monospace; }
    .success-row { border-left: 4px solid var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🩺 NPI → Yelp URL Builder</h1>
    <div class="card">
      <label>NPI List (one per line)</label>
      <textarea id="npiInput" placeholder="Enter 10-digit NPIs..."></textarea>

      <label>Select Proxy (preferred first; auto-failover on timeout/408)</label>
      <select id="proxySelect">
        <option value="https://api.allorigins.win/raw?url=">AllOrigins (Usually best for 403s)</option>
        <option value="https://corsproxy.io/?">CorsProxy.io (Faster, but stricter)</option>
        <option value="https://thingproxy.freeboard.io/fetch/">ThingProxy (Backup)</option>
      </select>

      <div class="row">
        <button id="runBtn" class="btn primary">Generate Yelp URLs</button>
        <button id="clearBtn" class="btn">Clear</button>
        <!-- Export button (added) -->
        <button id="exportBtn" class="btn">Export CSV</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>NPI</th>
            <th>Provider Name</th>
            <th>Location</th>
            <th>Yelp Search</th>
            <th class="muted">Actions</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const els = {
      npiInput: document.getElementById('npiInput'),
      runBtn: document.getElementById('runBtn'),
      clearBtn: document.getElementById('clearBtn'),
      exportBtn: document.getElementById('exportBtn'),
      proxySelect: document.getElementById('proxySelect'),
      status: document.getElementById('status'),
      resultsBody: document.getElementById('resultsBody'),
    };

    // Settings tuned for fewer "Failed to fetch" incidents.
    const SETTINGS = {
      maxRounds: 3,        // was 2
      baseTimeoutMs: 10000, // was 8000
      maxTimeoutMs: 20000,  // was 15000
      baseBackoffMs: 450,   // start backoff a tad higher
      perRowPacingMs: 300,  // delay between NPIs
    };

    // Proxy roster: preferred (from dropdown) first; then the rest; also attempt "Direct" (no proxy).
    const PROXIES = [
      { name: 'Direct', base: '', isDirect: true },
      { name: 'AllOrigins/raw', base: 'https://api.allorigins.win/raw?url=' },
      { name: 'CorsProxy.io', base: 'https://corsproxy.io/?' },
      { name: 'ThingProxy', base: 'https://thingproxy.freeboard.io/fetch/' },
    ];

    function nowTs() { return Date.now(); }

    function explainNetworkError(err) {
      if (!err) return 'Unknown error';
      if (err.name === 'AbortError') return 'Timeout (Proxy slow)';
      const msg = String(err.message || err);
      // Some likely patterns:
      if (/Failed to fetch/i.test(msg)) return 'Network/CORS error (proxy unreachable or blocked)';
      if (/429/.test(msg)) return 'Rate limited (429)';
      if (/408/.test(msg)) return 'Timeout (HTTP 408)';
      if (/5\d{2}/.test(msg)) return msg; // 5xx
      return msg;
    }

    async function fetchWithTimeout(url, options, timeout = 8000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal,
          mode: 'cors',
          headers: { 'Accept': 'application/json, text/plain, */*' },
          cache: 'no-store',
          referrerPolicy: 'no-referrer',
          keepalive: true
        });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    async function fetchJsonWithRetries(targetUrl, preferredBase, maxRounds = SETTINGS.maxRounds) {
      // Build attempt order: preferred first then others (including Direct), repeated by rounds
      const orderedOnce = [preferredBase, ...PROXIES.map(p => p.base).filter(b => b !== preferredBase)];
      const attempts = [];
      for (let r = 0; r < maxRounds; r++) attempts.push(...orderedOnce);

      let timeoutMs = SETTINGS.baseTimeoutMs;
      let lastErr = null;

      for (let i = 0; i < attempts.length; i++) {
        const base = attempts[i] || ''; // '' means Direct
        const proxyMeta = PROXIES.find(p => p.base === base) || (base === '' ? PROXIES[0] : { name: 'Custom', base });
        const url = base ? (base + encodeURIComponent(targetUrl)) : targetUrl;

        els.status.textContent = `Fetching via ${proxyMeta.name} (try ${i + 1}/${attempts.length})…`;

        try {
          const res = await fetchWithTimeout(url, { method: 'GET' }, timeoutMs);
          if (!res.ok) {
            // Retry on 408/429/5xx; for other codes, still try other proxies
            const statusMsg = `HTTP ${res.status}`;
            if (res.status === 408 || res.status === 429 || (res.status >= 500 && res.status <= 599)) {
              throw new Error(statusMsg);
            } else {
              // Try next proxy anyway (proxy-specific issue)
              throw new Error(statusMsg);
            }
          }

          const ct = (res.headers.get('content-type') || '').toLowerCase();
          if (ct.includes('application/json')) return await res.json();

          // Fallback: parse text as JSON (some proxies mislabel)
          const text = await res.text();
          try { return JSON.parse(text); } catch { throw new Error(`Bad JSON from ${proxyMeta.name}`); }
        } catch (err) {
          lastErr = err;
          const msg = String(err && err.message || err);
          // Increase timeout on timeouts and 408
          if (err.name === 'AbortError' || /408/.test(msg)) {
            timeoutMs = Math.min(timeoutMs + 4000, SETTINGS.maxTimeoutMs);
          }
          // Progressive backoff before next attempt
          const backoff = SETTINGS.baseBackoffMs * (1 + Math.min(i, 4)); // ~450, 900, 1350, …
          await new Promise(r => setTimeout(r, backoff));
          // Continue loop…
        }
      }
      throw lastErr || new Error('All proxies failed');
    }

    async function processNpi(npi, preferredProxyBase) {
      const target = `https://npiregistry.cms.hhs.gov/api/?version=2.1&number=${encodeURIComponent(npi)}&ts=${nowTs()}`;
      return await fetchJsonWithRetries(target, preferredProxyBase, SETTINGS.maxRounds);
    }

    function pickName(basic) {
      if (!basic) return '';
      if (basic.organization_name && basic.organization_name.trim().length) {
        return basic.organization_name.trim();
      }
      const first = (basic.first_name || '').trim();
      const last = (basic.last_name || '').trim();
      const full = [first, last].filter(Boolean).join(' ').trim();
      return full || '(No Name)';
    }

    function pickLocation(addresses) {
      if (!Array.isArray(addresses) || !addresses.length) return null;
      const loc = addresses.find(a => a.address_purpose === 'LOCATION') || addresses[0];
      const city = (loc.city || '').trim();
      const state = (loc.state || '').trim();
      if (!city && !state) return null;
      return `${city}${city && state ? ', ' : ''}${state}`;
    }

    function rowId(npi) { return `row-${npi}`; }

    function addSuccessRow(npi, name, loc, yelp) {
      const tr = document.createElement('tr');
      tr.id = rowId(npi);
      tr.className = 'success-row';
      tr.innerHTML = `
        <td class="mono">${npi}</td>
        <td>${name}</td>
        <td>${loc || '—'}</td>
        <td>${yelp ? `<a href="${yelp}" target="_blank" style="color:#93c5fd">Yelp Link</a>` : '—'}</td>
        <td class="muted">—</td>
      `;
      els.resultsBody.appendChild(tr);
    }

    function addErrorRow(npi, msg) {
      const tr = document.createElement('tr');
      tr.id = rowId(npi);
      tr.innerHTML = `
        <td class="mono">${npi}</td>
        <td colspan="2"><span class="error-text">${msg}</span></td>
        <td>—</td>
        <td>
          <button class="btn xs retry-btn" data-npi="${npi}">Retry</button>
        </td>
      `;
      els.resultsBody.appendChild(tr);
    }

    function replaceWithPending(npi, label='Retrying…') {
      const tr = document.getElementById(rowId(npi));
      if (!tr) return;
      tr.className = '';
      tr.innerHTML = `
        <td class="mono">${npi}</td>
        <td colspan="3" class="muted">${label}</td>
        <td class="muted">…</td>
      `;
    }

    function yelpUrlFor(name, cityState) {
      return `https://www.yelp.com/search?find_desc=${encodeURIComponent(name)}&find_loc=${encodeURIComponent(cityState || '')}`;
    }

    async function handleSingle(npi, preferredBase) {
      try {
        const data = await processNpi(npi, preferredBase);
        const result = (data && data.results && data.results[0]) || null;
        if (!result) {
          addErrorRow(npi, 'No record found');
          return false;
        }
        const name = pickName(result.basic);
        const cityState = pickLocation(result.addresses) || '—';
        addSuccessRow(npi, name, cityState, yelpUrlFor(name, cityState));
        return true;
      } catch (err) {
        addErrorRow(npi, explainNetworkError(err));
        console.debug('Fetch error for NPI', npi, err);
        return false;
      }
    }

    els.resultsBody.addEventListener('click', async (e) => {
      const btn = e.target.closest('.retry-btn');
      if (!btn) return;
      const npi = (btn.getAttribute('data-npi') || '').trim();
      if (!npi) return;
      const preferred = els.proxySelect.value;
      replaceWithPending(npi, 'Retrying with auto-failover…');
      await handleSingle(npi, preferred);
    });

    els.runBtn.addEventListener('click', async () => {
      const rawInput = els.npiInput.value.split('\n');
      const npis = [...new Set(rawInput.map(s => s.replace(/\D/g, '')).filter(s => s.length === 10))];
      if (!npis.length) return alert('Please enter valid 10-digit NPIs.');
      if (!navigator.onLine) {
        alert('You appear to be offline. Please check your connection and try again.');
        return;
      }
      els.resultsBody.innerHTML = '';
      els.status.textContent = 'Starting… (enhanced retries + per-row Retry enabled)';
      const preferred = els.proxySelect.value;

      let success = 0;
      let failedNpis = [];

      for (let i = 0; i < npis.length; i++) {
        const npi = npis[i];
        els.status.textContent = `Processing ${i + 1} of ${npis.length}…`;
        const ok = await handleSingle(npi, preferred);
        if (ok) success++; else failedNpis.push(npi);
        await new Promise(r => setTimeout(r, SETTINGS.perRowPacingMs));
      }

      // Automatic second-chance pass for any failures (helps with transient blips)
      if (failedNpis.length) {
        els.status.textContent = `Second pass on ${failedNpis.length} failed item(s)…`;
        const secondFailures = [];
        for (const npi of failedNpis) {
          replaceWithPending(npi, 'Second pass (auto-failover)…');
          const ok = await handleSingle(npi, preferred);
          if (!ok) secondFailures.push(npi);
          await new Promise(r => setTimeout(r, SETTINGS.perRowPacingMs));
        }
        failedNpis = secondFailures;
      }

      const summary = failedNpis.length
        ? `Done. ${success} succeeded, ${failedNpis.length} still failing (use Retry on each row).`
        : `Done. ${success} successfully linked.`;
      els.status.textContent = summary;
    });

    els.clearBtn.addEventListener('click', () => {
      els.resultsBody.innerHTML = '';
      els.status.textContent = '';
      els.npiInput.value = '';
    });

    // Export CSV (success rows)
    els.exportBtn.addEventListener('click', () => {
      const rows = Array.from(els.resultsBody.querySelectorAll('tr.success-row'));
      if (!rows.length) {
        alert('No successful rows to export yet.');
        return;
      }
      const header = ['NPI', 'Provider Name', 'Location', 'Yelp Search'];
      const csv = [header.join(',')];

      for (const row of rows) {
        const tds = row.querySelectorAll('td');
        const npi = (tds[0]?.textContent || '').trim();
        const name = (tds[1]?.textContent || '').trim().replace(/\s+/g, ' ');
        const loc = (tds[2]?.textContent || '').trim();
        let yelp = '';
        const link = tds[3]?.querySelector('a');
        if (link) yelp = link.href;

        const line = [npi, name, loc, yelp].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
        csv.push(line);
      }

      const blob = new Blob(['\uFEFF' + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `npi_yelp_links_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
