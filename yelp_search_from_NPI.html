<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPI to Yelp Pro - Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #2d3436;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        textarea {
            width: 100%; height: 100px; padding: 12px; border: 2px solid #dfe6e9;
            border-radius: 8px; font-family: monospace; margin-bottom: 15px; outline: none;
            box-sizing: border-box;
        }
        textarea:focus { border-color: #e00707; }

        .dashboard {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px;
            display: none; 
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 15px; }
        .stat-box { text-align: center; border-right: 1px solid #eee; }
        .stat-box:last-child { border-right: none; }
        .stat-val { display: block; font-size: 1.5rem; font-weight: bold; color: #e00707; }
        .stat-label { font-size: 0.8rem; color: #636e72; text-transform: uppercase; }
        
        .progress-container { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; }
        #progressBar { background: #e00707; width: 0%; height: 100%; transition: width 0.3s; }

        .controls { display: flex; gap: 10px; margin-bottom: 25px; }
        button {
            padding: 12px 24px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        #genBtn { background: #e00707; color: white; }
        .util-btn { background: #2d3436; color: white; display: none; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #b2bec3 !important; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { background: #2d3436; color: white; text-align: left; padding: 12px; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        tr:hover { background-color: #f1f2f6; }
        .yelp-link { color: #0073bb; text-decoration: none; font-weight: bold; }
        .yelp-link:visited { color: #8e44ad; }
        .yelp-link.clicked { color: #b2bec3; text-decoration: line-through; opacity: 0.7; }
        .error-row { color: #d63031; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <h2>NPI to Yelp URL List</h2>
        <p>Convert NPI numbers into localized Yelp search URLs.</p>
    </div>

    <textarea id="npiInput" placeholder="Enter NPI numbers (one per line)..."></textarea>

    <div class="controls">
        <button id="genBtn" onclick="processNPIs()">Generate List</button>
        <button id="copyBtn" class="util-btn" onclick="copyLinks()">Copy All URLs</button>
        <button id="csvBtn" class="util-btn" onclick="exportCSV()">Export CSV</button>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="stats-grid">
            <div class="stat-box"><span id="statProgress" class="stat-val">0/0</span><span class="stat-label">Processed</span></div>
            <div class="stat-box"><span id="statPercent" class="stat-val">0%</span><span class="stat-label">Complete</span></div>
            <div class="stat-box"><span id="statETA" class="stat-val">--</span><span class="stat-label">Time Remaining</span></div>
        </div>
        <div class="progress-container"><div id="progressBar"></div></div>
    </div>

    <table id="resultTable" style="display: none;">
        <thead>
            <tr>
                <th>NPI Number</th>
                <th>Provider Name</th>
                <th>Location</th>
                <th>Yelp Search URL</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let results = [];

        async function getNPIData(npi) {
            const apiURL = `https://npiregistry.cms.hhs.gov/api/?version=2.1&number=${npi}`;
            // Prioritize AllOrigins and CorsProxy.io as they are currently more stable for this API
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(apiURL)}`,
                `https://corsproxy.io/?${encodeURIComponent(apiURL)}`
            ];

            for (const url of proxies) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    
                    const json = await res.json();
                    // AllOrigins wraps the response in a .contents string
                    const data = typeof json.contents === 'string' ? JSON.parse(json.contents) : json;
                    
                    if (data && (data.results || data.Errors)) return data;
                } catch (e) { console.error("Proxy failed:", url); }
            }
            throw new Error('CORS fail');
        }

        function makeDisplayName(basic = {}) {
            if (basic.organization_name) return basic.organization_name;
            const first = basic.first_name || '';
            const last = basic.last_name || '';
            return `${first} ${last}`.trim() || 'Unknown';
        }

        async function processNPIs() {
            const input = document.getElementById('npiInput').value;
            const npis = input.split('\n').map(n => n.trim()).filter(n => /^\d+$/.test(n));

            if (npis.length === 0) return alert("Please enter valid numeric NPIs.");

            // Reset UI
            results = [];
            document.getElementById('genBtn').disabled = true;
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('resultTable').style.display = 'table';
            document.getElementById('tableBody').innerHTML = '';
            
            const startTime = Date.now();

            for (let i = 0; i < npis.length; i++) {
                let rowData = { npi: npis[i], name: 'Searching...', loc: '--', url: null };
                
                try {
                    const data = await getNPIData(npis[i]);
                    if (data.results && data.results.length > 0) {
                        const p = data.results[0];
                        const name = makeDisplayName(p.basic);
                        const addr = p.addresses.find(a => a.address_purpose === 'LOCATION') || p.addresses[0];
                        const loc = addr ? `${addr.city}, ${addr.state}` : 'N/A';
                        const url = `https://www.yelp.com/search?find_desc=${encodeURIComponent(name)}&find_loc=${encodeURIComponent(loc)}`;
                        rowData = { npi: npis[i], name, loc, url };
                    } else {
                        rowData = { npi: npis[i], name: 'Not Found', loc: 'N/A', url: null };
                    }
                } catch (e) {
                    rowData = { npi: npis[i], name: 'Connection Error', loc: 'N/A', url: null };
                }

                results.push(rowData);
                renderRow(rowData);
                updateProgress(i + 1, npis.length, startTime);
                await new Promise(r => setTimeout(r, 200)); // Rate limiting safety
            }

            document.getElementById('genBtn').disabled = false;
            document.querySelectorAll('.util-btn').forEach(b => b.style.display = 'inline-block');
            document.getElementById('statETA').innerText = "Done";
        }

        function renderRow(data) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${data.npi}</td>
                <td>**${data.name}**</td>
                <td>${data.loc}</td>
                <td>
                    ${data.url ? `<a href="${data.url}" target="_blank" class="yelp-link" onclick="this.classList.add('clicked')">View on Yelp ↗</a>` : '<span class="error-row">Unavailable</span>'}
                </td>
            `;
            document.getElementById('tableBody').appendChild(row);
        }

        function updateProgress(current, total, startTime) {
            const pct = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('statProgress').innerText = `${current}/${total}`;
            document.getElementById('statPercent').innerText = pct + '%';
            
            const elapsed = Date.now() - startTime;
            const remaining = Math.round(((elapsed / current) * (total - current)) / 1000);
            document.getElementById('statETA').innerText = remaining > 0 ? remaining + 's' : '--';
        }

        function copyLinks() {
            const text = results.filter(r => r.url).map(r => r.url).join('\n');
            if (!text) return alert("No URLs to copy.");
            navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
        }

        function exportCSV() {
            let csv = "NPI,Name,Location,YelpURL\n";
            results.forEach(r => csv += `${r.npi},"${r.name}","${r.loc}",${r.url || 'N/A'}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `npi_export_${new Date().getTime()}.csv`;
            link.click();
        }
    </script>
</body>
</html>
