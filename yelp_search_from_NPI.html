<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPI to Yelp Pro - Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #2d3436;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        textarea {
            width: 100%; height: 100px; padding: 12px; border: 2px solid #dfe6e9;
            border-radius: 8px; font-family: monospace; margin-bottom: 15px; outline: none;
        }
        textarea:focus { border-color: #e00707; }

        /* Progress Dashboard */
        .dashboard {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px;
            display: none; /* Hidden until processing starts */
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 15px; }
        .stat-box { text-align: center; border-right: 1px solid #eee; }
        .stat-box:last-child { border-right: none; }
        .stat-val { display: block; font-size: 1.5rem; font-weight: bold; color: #e00707; }
        .stat-label { font-size: 0.8rem; color: #636e72; text-transform: uppercase; }
        
        .progress-container { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; }
        #progressBar { background: #e00707; width: 0%; height: 100%; transition: width 0.3s; }

        .controls { display: flex; gap: 10px; margin-bottom: 25px; }
        button {
            padding: 12px 24px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        #genBtn { background: #e00707; color: white; }
        .util-btn { background: #2d3436; color: white; display: none; }
        button:disabled { background: #b2bec3 !important; cursor: not-allowed; }

        /* 4-Column Table */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { background: #2d3436; color: white; text-align: left; padding: 12px; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        tr:hover { background-color: #f1f2f6; }
        .yelp-link { color: #0073bb; text-decoration: none; font-weight: bold; }
        .error-row { color: #d63031; font-style: italic; }

        /* Style for links already in browser history */
        .yelp-link:visited {
            color: #8e44ad; /* Muted purple to show it's been visited */
        }

        /* Style for immediate feedback when clicked */
        .yelp-link.clicked {
            color: #b2bec3;
            text-decoration: line-through;
            opacity: 0.7;
        }     
    </style>
</head>
<body>

    <div class="header">
        <h2>NPI to Yelp URL List</h2>
        <p>Convert your NPI batch into search URLs with live progress tracking.</p>
    </div>

    <textarea id="npiInput" placeholder="Enter NPI numbers (one per line)..."></textarea>

    <div class="controls">
        <button id="genBtn" onclick="processNPIs()">Generate List</button>
        <button id="copyBtn" class="util-btn" onclick="copyLinks()">Copy All URLs</button>
        <button id="csvBtn" class="util-btn" onclick="exportCSV()">Export CSV</button>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="stats-grid">
            <div class="stat-box"><span id="statProgress" class="stat-val">0/0</span><span class="stat-label">Processed</span></div>
            <div class="stat-box"><span id="statPercent" class="stat-val">0%</span><span class="stat-label">Complete</span></div>
            <div class="stat-box"><span id="statETA" class="stat-val">--</span><span class="stat-label">Estimated ETA</span></div>
        </div>
        <div class="progress-container"><div id="progressBar"></div></div>
    </div>

    <table id="resultTable" style="display: none;">
        <thead>
            <tr>
                <th>NPI Number</th>
                <th>Provider Name</th>
                <th>Location</th>
                <th>Yelp Search URL</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let results = [];

        // --- HARDENED FETCH: tries direct, then multiple CORS proxies ---
        async function getNPIData(npi) {
            const base = `https://npiregistry.cms.hhs.gov/api/?version=2.1&number=${encodeURIComponent(npi)}`;
            const endpoints = [
                // Try direct first (works if NPI API allows CORS in your context)
                base,
                // Proxies: note the target URL is NOT URL-encoded for these two
                `https://corsproxy.io/?${base}`,
                `https://cors.isomorphic-git.org/${base}`,
                // AllOrigins returns raw body: parse JSON from text
                `https://api.allorigins.win/raw?url=${encodeURIComponent(base)}`
            ];

            for (const url of endpoints) {
                try {
                    const res = await fetch(url, { method: 'GET' });
                    if (!res.ok) continue;

                    // Content-type may be missing via some proxies; fall back to text->JSON
                    const ct = (res.headers.get('content-type') || '').toLowerCase();
                    let data;
                    if (ct.includes('application/json')) {
                        data = await res.json();
                    } else {
                        const txt = await res.text();
                        try { data = JSON.parse(txt); } catch { data = null; }
                    }
                    if (data && (data.results || data.Errors)) return data;
                } catch (e) {
                    // try next endpoint
                }
            }
            throw new Error('All CORS endpoints failed');
        }

        function selectBestAddress(addresses = []) {
            // Prefer LOCATION purpose; fallback to first address
            return addresses.find(a => a.address_purpose === 'LOCATION') || addresses[0] || null;
        }

        function makeDisplayName(basic = {}) {
            const first = (basic.first_name || '').trim();
            const last = (basic.last_name || '').trim();
            const org = (basic.organization_name || '').trim();
            const name = (first || last) ? `${first} ${last}`.trim() : org;
            return name || 'Unknown';
        }

        async function processNPIs() {
            const input = document.getElementById('npiInput').value;
            const npis = input.split('\n')
                              .map(n => n.trim())
                              .filter(n => n);

            if (npis.length === 0) return alert("Enter at least one NPI.");

            // Reset UI
            results = [];
            const genBtn = document.getElementById('genBtn');
            const dashboard = document.getElementById('dashboard');
            const tableBody = document.getElementById('tableBody');
            const table = document.getElementById('resultTable');
            const utilBtns = document.querySelectorAll('.util-btn');

            genBtn.disabled = true;
            dashboard.style.display = 'block';
            table.style.display = 'table';
            tableBody.innerHTML = '';
            utilBtns.forEach(b => b.style.display = 'none');

            const startTime = Date.now();

            for (let i = 0; i < npis.length; i++) {
                const npi = npis[i];
                let rowData = { npi, name: 'Loading...', loc: '--', url: null };

                try {
                    const data = await getNPIData(npi);

                    if (data.results && data.results.length > 0) {
                        const p = data.results[0];
                        const name = makeDisplayName(p.basic || {});
                        const addr = selectBestAddress(p.addresses || []);
                        const city = (addr && addr.city) ? addr.city : '';
                        const state = (addr && addr.state) ? addr.state : '';
                        const loc = [city, state].filter(Boolean).join(', ');
                        const url = (name && loc)
                            ? `https://www.yelp.com/search?find_desc=${encodeURIComponent(name)}&find_loc=${encodeURIComponent(loc)}`
                            : null;

                        rowData = { npi, name, loc: loc || 'N/A', url };
                    } else {
                        rowData = { npi, name: 'Not Found', loc: 'N/A', url: null };
                    }
                } catch (e) {
                    rowData = { npi, name: 'Error Fetching', loc: 'N/A', url: null };
                }

                results.push(rowData);
                updateRow(rowData);
                updateProgress(i + 1, npis.length, startTime);

                // Small delay to avoid hammering endpoints (optional but safer)
                await new Promise(r => setTimeout(r, 120));
            }

            genBtn.disabled = false;
            utilBtns.forEach(b => b.style.display = 'inline-block');
            document.getElementById('statETA').innerText = "Finished";
        }

        function updateRow(data) {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${data.npi}</td>
                <td>${data.name}</td>
                <td>${data.loc}</td>
                <td>
                    ${data.url ? 
                        `<a href="${data.url}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="yelp-link" 
                            onclick="this.classList.add('clicked')">
                            View on Yelp ↗
                         </a>` 
                        : '<span class="error-row">N/A</span>'}
                </td>
            `;
            tbody.appendChild(row);
        }

        function updateProgress(current, total, startTime) {
            const percent = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('statProgress').innerText = `${current}/${total}`;
            document.getElementById('statPercent').innerText = percent + '%';

            // ETA Calculation
            const elapsed = Date.now() - startTime;
            const avgTime = elapsed / current;
            const remaining = (total - current) * avgTime;
            
            if (remaining > 0) {
                const seconds = Math.round(remaining / 1000);
                document.getElementById('statETA').innerText = seconds + 's';
            }
        }

        function copyLinks() {
            const list = results.filter(r => r.url).map(r => r.url).join('\n');
            navigator.clipboard.writeText(list)
                .then(() => alert("All URLs copied!"))
                .catch(() => alert("Copy failed. Your browser may require HTTPS. Export CSV instead."));
        }

        function exportCSV() {
            let csv = "NPI,Name,Location,YelpURL\n";
            results.forEach(r => {
                const safeName = (r.name || '').replace(/"/g, '""');
                const safeLoc  = (r.loc || '').replace(/"/g, '""');
                csv += `${r.npi},"${safeName}","${safeLoc}",${r.url || 'N/A'}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'npi_batch_export.csv');
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
