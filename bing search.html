<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing Entity List Search</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #00a1f1; /* Bing Blue */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --visited-color: #e8f5e9;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
        }
        textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 15px;
            resize: vertical;
            min-height: 120px;
        }
        button {
            padding: 12px 25px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }
        tr.clicked-row {
            background-color: var(--visited-color) !important;
        }
        a {
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bing Entity List Search</h2>
    
    <div class="input-group">
        <label for="entityList">Entity Names (One per line)</label>
        <textarea id="entityList" placeholder="Acme Corp&#10;Globex Inc&#10;Soylent Corp"></textarea>
        <button onclick="generateBingLinks()">Generate Bing Links</button>
    </div>

    <table id="resultsTable" style="display:none;">
        <thead>
            <tr>
                <th width="70%">Entity Name</th>
                <th width="30%">Action</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
</div>

<script>
    function markAsVisited(element) {
        const row = element.closest('tr');
        row.classList.add('clicked-row');
    }

    function generateBingLinks() {
        const input = document.getElementById('entityList').value.trim();
        const tbody = document.getElementById('resultsBody');
        const table = document.getElementById('resultsTable');

        if (!input) {
            alert("Please enter at least one entity name.");
            return;
        }

        // Split by newline and filter out empty lines
        const entities = input.split('\n').map(e => e.trim()).filter(e => e.length > 0);
        
        let htmlRows = "";

        entities.forEach(entity => {
            const queryEnc = encodeURIComponent(entity);
            const bingUrl = `https://www.bing.com/maps/search?q=${queryEnc}`;

            htmlRows += `
                <tr>
                    <td><strong>${entity}</strong></td>
                    <td>
                        <a href="${bingUrl}" target="_blank" onclick="markAsVisited(this)">
                            Open Bing Maps
                        </a>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = htmlRows;
        table.style.display = "table";
    }
</script>

</body>
</html>
