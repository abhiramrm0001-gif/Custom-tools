<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Search Tool</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60; /* Changed to a medical green tone */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --visited-color: #e8f5e9;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto; /* Adjusted for 2 inputs + button */
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 15px;
        }

        button {
            padding: 12px 25px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            height: 45px;
            transition: background 0.2s;
        }

        button:hover { background-color: #219150; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        tr.clicked-row {
            background-color: var(--visited-color) !important;
            transition: background-color 0.3s ease;
        }

        a {
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
        }

        a:hover { text-decoration: underline; }

        .site-col { background-color: #fcfcfc; }
        
        code {
            background: #eee;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.85em;
            color: #d35400;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Provider Search Generator</h2>

    <div class="input-group">
        <div class="input-wrapper">
            <label for="entityName">Provider Name</label>
            <input type="text" id="entityName" placeholder="e.g. Philipp Schulz">
        </div>
        <div class="input-wrapper">
            <label for="location">City, State</label>
            <input type="text" id="location" placeholder="e.g. Corsicana, TX">
        </div>
        <button onclick="generateLinks()">Generate Results</button>
    </div>

    <table id="resultsTable" style="display:none;">
        <thead>
            <tr>
                <th width="40%">Direct Platform Search</th>
                <th width="60%">Google Site: Search </th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
</div>

<script>
    function markAsVisited(element) {
        const row = element.closest('tr');
        row.classList.add('clicked-row');
    }

    function generateLinks() {
        const name = document.getElementById('entityName').value.trim();
        const loc = document.getElementById('location').value.trim();
        const tbody = document.getElementById('resultsBody');
        const table = document.getElementById('resultsTable');

        if (!name || !loc) {
            alert("Please enter Name and Location.");
            return;
        }

        const nameEnc = encodeURIComponent(name);
        const locEnc = encodeURIComponent(loc);
        
        // Full Google Query string for site searches
        const fullQuery = encodeURIComponent(`${name} ${loc}`);

        const sources = [
            {
                title: "DocSpot",
                domain: "docspot.com",
                directUrl: `https://www.docspot.com/find?concept=${nameEnc}`
            },
            {
                title: "Wellness.com",
                domain: "wellness.com",
                directUrl: `https://www.wellness.com/dir/search/${nameEnc}`
            },
            {
                title: "RateMDs",
                domain: "ratemds.com",
                directUrl: `https://www.ratemds.com/best-doctors/?text=${nameEnc}&location=${locEnc}`
            },
            {
                title: "YellowPages",
                domain: "yellowpages.com",
                directUrl: `https://www.yellowpages.com/search?search_terms=${nameEnc}&geo_location_terms=${locEnc}`
            },
            {
                title: "Yelp",
                domain: "yelp.com",
                directUrl: `https://www.yelp.com/search?find_desc=${nameEnc}&find_loc=${locEnc}`
            },
            {
                title: "Doctor.com",
                domain: "doctor.com",
                // Using first_name/last_name fields often requires splitting, but most search inputs 
                // handle full string in one field or have a general keyword search. 
                // This maps the name to first_name which acts as a general keyword on many legacy forms.
                directUrl: `https://www.doctor.com/find-a-doctor?search_type=lookup&provider_id=&practice_id=&l_location_id=&first_name=${nameEnc}&last_name=${nameEnc}`
            },
            {
                title: "WebMD",
                domain: "doctor.webmd.com",
                directUrl: `https://doctor.webmd.com/results?q=${name} ${loc}`
            },
            {
                title: "Vitals",
                domain: "vitals.com",
                directUrl: `https://www.vitals.com/search?query=${nameEnc}&city_state=${locEnc}`
            },
            {
                title: "Bing",
                domain: "bing.com",
                directUrl: `https://www.bing.com/search?q=${fullQuery}`
            }
        ];

        let htmlRows = "";

        sources.forEach(source => {
            let siteSearchLink = "";
            if (source.domain) {
                const googleUrl = `https://www.google.com/search?q=site:${source.domain}+${fullQuery}`;
                siteSearchLink = `<a href="${googleUrl}" target="_blank" onclick="markAsVisited(this)"><code>site:${source.domain}</code> Search</a>`;
            } else {
                siteSearchLink = "<em>N/A</em>";
            }

            htmlRows += `
                <tr>
                    <td><a href="${source.directUrl}" target="_blank" onclick="markAsVisited(this)">${source.title} Direct</a></td>
                    <td class="site-col">${siteSearchLink}</td>
                </tr>
            `;
        });

        tbody.innerHTML = htmlRows;
        table.style.display = "table";
    }
</script>

</body>
</html>
