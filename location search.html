<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Entity Search Tool</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --visited-color: #e8f5e9; /* Light green for clicked rows */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 15px;
        }

        button {
            padding: 12px 25px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            height: 45px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        #openAllButtons {
            display: none;
            gap: 15px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        /* The magic "Clicked" state */
        tr.clicked-row {
            background-color: var(--visited-color) !important;
            transition: background-color 0.3s ease;
        }

        a {
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        .site-col {
            background-color: #fcfcfc;
        }

        code {
            background: #eee;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.85em;
            color: #d35400;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Entity Search Generator</h2>

    <div class="input-group">
        <div class="input-wrapper">
            <label for="entityName">Entity Name</label>
            <input type="text" id="entityName" placeholder="e.g. Acme Corp">
        </div>

        <div class="input-wrapper">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="e.g. 123 Main St">
        </div>

        <div class="input-wrapper">
            <label for="location">City, State</label>
            <input type="text" id="location" placeholder="e.g. Miami, FL">
        </div>

        <button onclick="generateLinks()">Generate Results</button>
    </div>

    <div id="openAllButtons">
        <button onclick="openAllDirect()">
            Open All Direct Platform Search
        </button>

        <button onclick="openAllGoogleSite()">
            Open All Google Site: Search
        </button>
    </div>

    <table id="resultsTable" style="display:none;">
        <thead>
            <tr>
                <th width="40%">Direct Platform Search</th>
                <th width="60%">Google Site: Search</th>
            </tr>
        </thead>

        <tbody id="resultsBody"></tbody>
    </table>
</div>

<script>
    let directUrls = [];
    let googleSiteUrls = [];

    function markAsVisited(element) {
        // Finds the parent row of the clicked link and adds the class
        const row = element.closest('tr');
        row.classList.add('clicked-row');
    }

    function openAllDirect() {
        directUrls.forEach(function(url) {
            window.open(url, '_blank');
        });

        document.querySelectorAll('.direct-link').forEach(function(link) {
            markAsVisited(link);
        });
    }

    function openAllGoogleSite() {
        googleSiteUrls.forEach(function(url) {
            window.open(url, '_blank');
        });

        document.querySelectorAll('.site-link').forEach(function(link) {
            markAsVisited(link);
        });
    }

    function generateLinks() {
        const name = document.getElementById('entityName').value.trim();
        const loc = document.getElementById('location').value.trim();
        const addr = document.getElementById('address').value.trim();
        const tbody = document.getElementById('resultsBody');
        const table = document.getElementById('resultsTable');
        const openAllButtons = document.getElementById('openAllButtons');

        if (!name || !loc) {
            alert("Please enter Name and Location.");
            return;
        }

        const nameEnc = encodeURIComponent(name);
        const locEnc = encodeURIComponent(loc);

        // Full Google Query string
        const fullQuery = encodeURIComponent(`${name} ${addr} ${loc}`);

        const sources = [
            {
                title: "Google Search (Full)",
                domain: null,
                directUrl: `https://www.google.com/search?q=${fullQuery}`,
                isSpecial: true
            },
            {
                title: "BBB",
                domain: "bbb.org",
                directUrl: `https://www.bbb.org/search?find_text=${nameEnc}&find_loc=${locEnc}`
            },
            {
                title: "Yelp",
                domain: "yelp.com",
                directUrl: `https://www.yelp.com/search?find_desc=${nameEnc}&find_loc=${locEnc}`
            },
            {
                title: "Superpages",
                domain: "superpages.com",
                directUrl: `https://www.superpages.com/search?search_terms=${nameEnc}&geo_location_terms=${locEnc}`
            },
            {
                title: "Yellowpages",
                domain: "yellowpages.com",
                directUrl: `https://www.yellowpages.com/search?search_terms=${nameEnc}&geo_location_terms=${locEnc}`
            },
            {
                title: "Foursquare",
                domain: "foursquare.com",
                directUrl: `https://app.foursquare.com/explore?mode=url&near=${locEnc}&q=${nameEnc}`
            }
        ];

        directUrls = [];
        googleSiteUrls = [];

        let htmlRows = "";

        sources.forEach(function(source) {
            directUrls.push(source.directUrl);

            let siteSearchLink = "";

            if (source.domain) {
                const googleUrl =
                    `https://www.google.com/search?q=site%3A${encodeURIComponent(source.domain)}+${fullQuery}`;

                googleSiteUrls.push(googleUrl);

                siteSearchLink = `
                    ${googleUrl}
                        <code>site:${source.domain}</code> Search
                    </a>
                `;
            } else {
                siteSearchLink = source.isSpecial
                    ? "<strong>Comprehensive Search</strong>"
                    : "<em>N/A</em>";
            }

            htmlRows += `
                <tr>
                    <td>
                        ${source.directUrl}
                            ${source.title} Direct
                        </a>
                    </td>

                    <td class="site-col">
                        ${siteSearchLink}
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = htmlRows;
        table.style.display = "table";
        openAllButtons.style.display = "flex";
    }
</script>

</body>
</html>
