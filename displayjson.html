<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk ID URL Generator</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; line-height: 1.5; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1e293b; font-size: 1.25rem; }
        
        .field { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #475569; }
        
        input[type="text"], textarea { 
            width: 100%; padding: 12px; border: 1px solid var(--border); 
            border-radius: 6px; box-sizing: border-box; font-family: monospace;
        }
        textarea { height: 120px; resize: vertical; }
        
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        .btn { 
            background: var(--primary); color: white; border: none; padding: 10px 20px; 
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-clear { background: #ef4444; }

        .link-list { margin-top: 30px; border-top: 2px solid var(--bg); padding-top: 20px; }
        .url-item { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; background: #fff; border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 8px; font-size: 13px;
        }
        .url-item code { color: #2563eb; font-weight: bold; }
        .open-btn { 
            background: #10b981; color: white; text-decoration: none; 
            padding: 5px 12px; border-radius: 4px; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔗 Bulk URL Generator</h2>
    
    <div class="field">
        <label>Main API URL (Base)</label>
        <input type="text" id="baseUrl" value="https://social-crawler-api.consumerism.pressganey.com/api/suggested/sources/Person/7908070">
    </div>

    <div class="field">
        <label>List of Unique IDs (one per line)</label>
        <textarea id="idList" placeholder="7908070&#10;7908071&#10;7908072"></textarea>
    </div>

    <div class="controls">
        <button class="btn" onclick="generateLinks()">Generate Links</button>
        <button class="btn btn-clear" onclick="clearAll()">Clear</button>
    </div>

    <div id="resultArea" class="link-list hidden">
        <label>Generated Links:</label>
        <div id="linkContainer"></div>
    </div>
</div>

<script>
    function generateLinks() {
        const fullUrl = document.getElementById('baseUrl').value.trim();
        const rawIds = document.getElementById('idList').value;
        const container = document.getElementById('linkContainer');
        const resultArea = document.getElementById('resultArea');

        // Logic to get the base part of the URL (everything before the last ID)
        // We find the last "/" and keep everything before it.
        const basePart = fullUrl.substring(0, fullUrl.lastIndexOf("/") + 1);

        // Split the IDs by new lines and filter out empty lines
        const ids = rawIds.split(/\r?\n/).filter(id => id.trim() !== "");

        if (ids.length === 0) {
            alert("Please enter at least one ID.");
            return;
        }

        container.innerHTML = ""; // Clear old links
        resultArea.classList.remove('hidden');

        ids.forEach(id => {
            const cleanId = id.trim();
            const targetUrl = basePart + cleanId;

            const div = document.createElement('div');
            div.className = 'url-item';
            div.innerHTML = `
                <span>ID: <code>${cleanId}</code></span>
                <a href="${targetUrl}" target="_blank" class="open-btn">Open & Download</a>
            `;
            container.appendChild(div);
        });
    }

    function clearAll() {
        document.getElementById('idList').value = "";
        document.getElementById('linkContainer').innerHTML = "";
        document.getElementById('resultArea').classList.add('hidden');
    }
</script>

</body>
</html>
