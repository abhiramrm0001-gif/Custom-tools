<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Tools</title>
    <style>
        /* General Page Reset and Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensures footer stays at bottom */
        }

        /* Container for the main content */
        .container {
            width: 100%;
            max-width: 600px;
            margin: 60px auto; /* Centers the container */
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Styling the List */
        ul {
            list-style-type: none; /* Removes bullet points */
            padding: 0;
        }

        li {
            margin-bottom: 15px;
        }

        /* Styling the Links (Cards) */
        a {
            display: block;
            text-decoration: none;
            background-color: #ffffff;
            color: #444;
            padding: 18px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db; /* Blue accent bar */
            transition: all 0.3s ease; /* Smooth animation */
            font-weight: 500;
            font-size: 1.1rem;
            text-align: left;
        }

        /* Hover Effects */
        a:hover {
            background-color: #3498db;
            color: #ffffff;
            transform: translateY(-3px); /* Lifts the card up slightly */
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        /* Footer Styling */
        footer {
            margin-top: auto; /* Pushes footer to the bottom */
            padding: 20px;
            text-align: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-size: 0.9rem;
        }
    </style>
</head>
